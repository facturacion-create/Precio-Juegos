# Visita la app cada 10 minutos para que Render (plan gratis) no la duerma.
# Render duerme las apps gratis después de 15 minutos sin visitas, y la primera
# visita después tarda ~50 segundos.
#
# Horario: de 8:00 a 3:00 (hora argentina, UTC-3). De madrugada no se la
# despierta, para dejar margen con el límite del plan gratis de Render
# (750 horas por mes): así usa unas 590 horas por mes.
name: Mantener la app despierta

on:
  schedule:
    # Cada 10 minutos de 11:00 a 05:59 UTC = de 8:00 a 2:59 hora argentina
    - cron: "*/10 0-5,11-23 * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  despertar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visitar la app
        run: curl -fsS --max-time 120 -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" https://precio-juegos.onrender.com/healthz
